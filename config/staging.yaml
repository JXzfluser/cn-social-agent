# 预发布/测试环境配置
# 通过 APP_ENV=staging 加载

llm:
  model: MiniMax-Text-01
  temperature: 0.7
  timeout: 60.0
  max_tokens: 4000

agent:
  max_steps: 10
  step_interval: 1.0
  auto_retry: true
  max_retries: 3
  review_workflow_enabled: true
  thinking_enabled: false

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  console_enabled: true
  file_path: logs/staging.log
  max_bytes: 52428800        # 50MB
  backup_count: 10

database:
  echo: false
  url: data/cn_social_agent.staging.db
  pool_size: 5

webhook:
  enabled: true
  retry_on_failure: true
  max_retries: 5
  timeout: 15
