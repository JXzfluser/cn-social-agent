<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国人口结构图鉴 · 第七次全国人口普查</title>
<style>
/* ===== Reset & Base ===== */
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;
  background:#0a0a0a;color:#fff;overflow-x:hidden;line-height:1.5;
}
:root{
  --bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--border:#2a2a2a;
  --orange:#FF5C39;--teal:#00E5CC;--yellow:#FFE03D;--pink:#FF3D7F;
  --green:#4ADE80;--blue:#38BDF8;--purple:#A78BFA;
  --t1:#fff;--t2:#999;--t3:#555;
}
/* ===== Hero ===== */
.hero{position:relative;padding:60px 40px 40px;border-bottom:1px solid var(--border);overflow:hidden}
.hero-tag{display:inline-block;padding:4px 12px;background:var(--orange);color:#000;font-size:12px;font-weight:800;letter-spacing:2px;margin-bottom:16px}
.hero h1{font-size:64px;font-weight:900;line-height:1;letter-spacing:-2px;margin-bottom:8px}
.hero h1 span{color:var(--orange)}
.hero-sub{font-size:16px;color:var(--t2);margin-bottom:4px}
.hero-src{font-size:12px;color:var(--t3)}
.hero-visual{position:absolute;top:40px;right:40px;width:360px;height:200px;opacity:.9}
@media(max-width:900px){.hero-visual{display:none}.hero h1{font-size:40px}}
/* National metrics */
.nat-metrics{display:flex;flex-wrap:wrap;gap:0;margin-top:32px;border-top:1px solid var(--border)}
.nat-metric{flex:1;min-width:140px;padding:20px 24px;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
.nat-metric:last-child{border-right:none}
.nat-metric .nm-num{font-size:48px;font-weight:900;line-height:1;letter-spacing:-1px}
.nat-metric .nm-unit{font-size:20px;font-weight:700;color:var(--t2);margin-left:2px}
.nat-metric .nm-label{font-size:13px;color:var(--t2);margin-top:8px;letter-spacing:1px}
.nm-orange .nm-num{color:var(--orange)}
.nm-teal .nm-num{color:var(--teal)}
.nm-yellow .nm-num{color:var(--yellow)}
.nm-pink .nm-num{color:var(--pink)}
.nm-green .nm-num{color:var(--green)}
/* ===== Section Title ===== */
.sec-title{display:flex;align-items:baseline;gap:16px;padding:48px 40px 24px}
.sec-title h2{font-size:28px;font-weight:900;letter-spacing:-.5px}
.sec-title span{font-size:14px;color:var(--t3)}
/* ===== Sort Bar ===== */
.sort-bar{display:flex;gap:8px;padding:0 40px 24px;flex-wrap:wrap}
.sort-btn{padding:8px 18px;background:var(--surface);border:1px solid var(--border);color:var(--t2);font-size:13px;font-weight:600;cursor:pointer;border-radius:0;transition:all .2s;letter-spacing:1px}
.sort-btn:hover{color:#fff;border-color:#444}
.sort-btn.active{background:#fff;color:#000;border-color:#fff;font-weight:800}
/* ===== Province Grid ===== */
.province-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1px;background:var(--border);padding:0 40px 48px}
.prov-card{background:var(--surface);padding:24px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.prov-card:hover{background:var(--surface2)}
.prov-card .pc-region{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:.6}
.prov-card .pc-name{font-size:22px;font-weight:800;margin:4px 0 12px}
.prov-card .pc-pop{font-size:36px;font-weight:900;line-height:1;letter-spacing:-1px}
.prov-card .pc-unit{font-size:14px;color:var(--t2);font-weight:600;margin-left:2px}
.prov-card .pc-growth{font-size:12px;margin-top:8px;font-weight:600}
.pc-bar{display:flex;height:4px;margin-top:12px;border-radius:0}
.pc-bar span{display:block}
.pc-color-strip{position:absolute;top:0;left:0;width:4px;height:100%}
/* ===== Detail Section ===== */
.detail-section{padding:0 40px 60px;display:none}
.detail-section.active{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;background:var(--surface);border:1px solid var(--border);color:var(--t2);font-size:14px;font-weight:600;cursor:pointer;margin:32px 0 24px;transition:all .2s;letter-spacing:1px}
.back-btn:hover{color:#fff;border-color:#555;background:var(--surface2)}
/* Province Header */
.prov-header{display:flex;align-items:flex-end;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.prov-header .ph-name{font-size:80px;font-weight:900;line-height:.9;letter-spacing:-3px}
.prov-header .ph-info{padding-bottom:12px}
.prov-header .ph-region{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--t2)}
.prov-header .ph-rank{font-size:14px;color:var(--t3);margin-top:4px}
/* Metric Cards */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--border);margin-bottom:32px}
.m-card{background:var(--surface);padding:28px 24px;position:relative}
.m-card .mc-label{font-size:12px;font-weight:700;letter-spacing:2px;color:var(--t2);text-transform:uppercase}
.m-card .mc-num{font-size:56px;font-weight:900;line-height:1;letter-spacing:-2px;margin:12px 0 8px}
.m-card .mc-unit{font-size:18px;font-weight:700;color:var(--t2);margin-left:4px}
.m-card .mc-compare{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
.m-card .mc-compare.up{color:var(--green)}
.m-card .mc-compare.down{color:var(--orange)}
/* Chart Grid */
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);margin-bottom:32px}
@media(max-width:900px){.chart-grid{grid-template-columns:1fr}}
.chart-box{background:var(--surface);padding:32px}
.chart-box.full{grid-column:1/-1}
.chart-title{font-size:14px;font-weight:800;letter-spacing:2px;color:var(--t2);text-transform:uppercase;margin-bottom:4px}
.chart-subtitle{font-size:12px;color:var(--t3);margin-bottom:24px}
.chart-svg-wrap{width:100%}
.chart-svg-wrap svg{width:100%;height:auto;display:block}
/* City Section */
.city-list-title{display:flex;align-items:baseline;gap:16px;margin:48px 0 24px}
.city-list-title h3{font-size:24px;font-weight:900}
.city-list-title span{font-size:14px;color:var(--t3)}
.city-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1px;background:var(--border)}
.city-card{background:var(--surface);padding:20px;cursor:pointer;transition:all .2s;position:relative}
.city-card:hover{background:var(--surface2)}
.city-card .cc-name{font-size:18px;font-weight:800;margin-bottom:8px}
.city-card .cc-pop{font-size:28px;font-weight:900;line-height:1}
.city-card .cc-unit{font-size:13px;color:var(--t2);font-weight:600}
.city-card .cc-bar{height:3px;margin-top:12px}
/* City Detail */
.city-section{padding:0 40px 60px;display:none}
.city-section.active{display:block;animation:fadeUp .4s ease}
.city-header{display:flex;align-items:flex-end;gap:24px;margin-bottom:32px;flex-wrap:wrap}
.city-header .ch-name{font-size:64px;font-weight:900;line-height:.9;letter-spacing:-2px}
.city-header .ch-pop{font-size:48px;font-weight:900;color:var(--teal)}
.city-header .ch-unit{font-size:20px;font-weight:700;color:var(--t2)}
.compare-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--border);margin-bottom:32px}
.compare-card{background:var(--surface);padding:24px}
.compare-card .cp-label{font-size:12px;font-weight:700;letter-spacing:1px;color:var(--t2)}
.compare-card .cp-bars{display:flex;align-items:center;gap:12px;margin-top:12px}
.compare-card .cp-bar-wrap{flex:1}
.compare-card .cp-bar-label{font-size:11px;color:var(--t3);margin-bottom:4px}
.compare-card .cp-bar{height:24px;display:flex;align-items:center}
.compare-card .cp-bar-fill{height:100%;transition:width .5s}
.compare-card .cp-val{font-size:20px;font-weight:800}
.compare-card .cp-prov{color:var(--orange)}
.compare-card .cp-city{color:var(--teal)}
/* Footer */
footer{padding:40px;border-top:1px solid var(--border);text-align:center}
footer p{font-size:13px;color:var(--t3);margin-bottom:4px}
footer p:first-child{color:var(--t2);font-weight:600}
/* Decorative Image 2 */
.deco-img{position:absolute;top:20px;right:20px;width:120px;height:120px;opacity:.15;pointer-events:none}
</style>
</head>

const RC = {"华北":"#FF5C39","东北":"#00E5CC","华东":"#FFE03D","华中":"#FF3D7F","华南":"#4ADE80","西南":"#A78BFA","西北":"#38BDF8"};

// ===== AGE GROUP PATTERN (National 5-year groups, %) =====
const AG_LABELS = ["0-4","5-9","10-14","15-19","20-24","25-29","30-34","35-39","40-44","45-49","50-54","55-59","60-64","65-69","70-74","75-79","80+"];
const AG_NAT = [5.36,6.09,6.19,6.05,6.48,7.24,8.83,9.10,7.79,8.30,8.62,7.21,5.55,5.27,3.77,2.31,1.88];
// Sub-group proportions within major groups
const SUB_014 = [0.299,0.340,0.361]; // 0-4, 5-9, 10-14
const SUB_1559 = [0.096,0.102,0.114,0.139,0.143,0.123,0.131,0.136,0.116]; // 15-19..55-59
const SUB_60 = [0.297,0.282,0.201,0.124,0.096]; // 60-64..80+

function genAgeGroups(prov){
  const a = prov.a;
  const groups = [];
  let idx = 0;
  // 0-14
  for(let i=0;i<3;i++) groups.push(a[0]*SUB_014[i]);
  // 15-59
  for(let i=0;i<9;i++) groups.push(a[1]*SUB_1559[i]);
  // 60+
  for(let i=0;i<5;i++) groups.push(a[2]*SUB_60[i]);
  return groups;
}

// ===== UTILS =====
function fmt(n){return n.toLocaleString('zh-CN',{maximumFractionDigits:2})}
function fmtPct(n){return n.toFixed(2)+'%'}
function growthRate(p,p10){return ((p-p10)/p10*100).toFixed(2)}

// ===== RENDER: Hero Visual (SVG Image 1 - China Population Grid) =====
function renderHeroVisual(){
  const provs = Object.entries(PD).sort((a,b)=>b[1].p-a[1].p);
  const cols = 8;
  const rows = Math.ceil(provs.length/cols);
  const cw = 42, ch = 42, gap = 2;
  const w = cols*(cw+gap);
  const h = rows*(ch+gap);
  let blocks = '';
  const maxPop = provs[0][1].p;
  provs.forEach((p,i)=>{
    const r = Math.floor(i/cols);
    const c = i%cols;
    const x = c*(cw+gap);
    const y = r*(ch+gap);
    const opacity = 0.3 + 0.7*(p[1].p/maxPop);
    const color = RC[p[1].r];
    blocks += `<rect x="${x}" y="${y}" width="${cw}" height="${ch}" fill="${color}" opacity="${opacity}" rx="2"/>`;
    blocks += `<text x="${x+cw/2}" y="${y+ch/2+4}" text-anchor="middle" font-size="10" font-weight="700" fill="#000" opacity="0.7">${p[0]}</text>`;
  });
  document.getElementById('heroVisual').innerHTML = 
    `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${blocks}</svg>`;
}

// ===== RENDER: Province Grid =====
function renderProvGrid(){
  const grid = document.getElementById('provGrid');
  let arr = Object.entries(PD).map(([k,v])=>({name:k,...v,growth:parseFloat(growthRate(v.p,v.p10))}));
  arr.sort((a,b)=>{
    if(currentSort==='a2') return b.a[2]-a.a[2];
    if(currentSort==='growth') return b.growth-a.growth;
    return b[currentSort]-a[currentSort];
  });
  const maxPop = arr[0].p;
  grid.innerHTML = arr.map(p=>{
    const growth = p.growth;
    const growthColor = growth>0?'var(--green)':'var(--orange)';
    return `<div class="prov-card" onclick="showDetail('${p.name}')" style="border-top:3px solid ${p.co}">
      <div class="pc-region" style="color:${p.co}">${p.r}</div>
      <div class="pc-name">${p.name}</div>
      <div><span class="pc-pop" style="color:${p.co}">${fmt(p.p)}</span><span class="pc-unit">万人</span></div>
      <div class="pc-growth" style="color:${growthColor}">${growth>0?'+':''}${growth}% vs 2010</div>
      <div class="pc-bar">

        <span style="width:${p.a[2]}%;background:var(--orange)"></span>
      </div>
    </div>`;
  }).join('');
}

// ===== SVG CHART: Age Pyramid =====
function svgAgePyramid(prov,name){
  const groups = genAgeGroups(prov);
  const ratio = prov.g;
  const malePct = ratio/(100+ratio);
  const femalePct = 1-malePct;
  const w=680,h=440,cx=340,marginT=30,marginB=40,marginL=10,marginR=10;
  const barH = (h-marginT-marginB)/groups.length;
  const maxVal = Math.max(...groups)*Math.max(malePct,femalePct);
  const maxBarW = cx-marginL-50;
  let bars = '';
  let labels = '';
  groups.forEach((g,i)=>{
    const y = marginT + i*barH;
    const maleVal = g*malePct;
    const femaleVal = g*femalePct;
    const maleW = (maleVal/maxVal)*maxBarW;
    const femaleW = (femaleVal/maxVal)*maxBarW;
    bars += `<rect x="${cx-maleW}" y="${y+1}" width="${maleW}" height="${barH-2}" fill="#38BDF8" opacity="0.85" rx="1"/>`;
    bars += `<rect x="${cx}" y="${y+1}" width="${femaleW}" height="${barH-2}" fill="#FF3D7F" opacity="0.85" rx="1"/>`;
    labels += `<text x="${cx}" y="${y+barH/2+4}" text-anchor="middle" font-size="10" fill="#666">${AG_LABELS[i]}</text>`;
  });
  // Axis labels
  const axisLabels = `
    <text x="${marginL}" y="${h-10}" font-size="12" font-weight="700" fill="#38BDF8">男性 ${malePct*100|0}%</text>
    <text x="${w-marginR}" y="${h-10}" text-anchor="end" font-size="12" font-weight="700" fill="#FF3D7F">女性 ${(femalePct*100)|0}%</text>
    <line x1="${cx}" y1="${marginT-5}" x2="${cx}" y2="${h-marginB}" stroke="#333" stroke-width="1"/>
  `;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <text x="${w/2}" y="18" text-anchor="middle" font-size="13" fill="#888">年龄组（岁）</text>
    ${bars}${labels}${axisLabels}
  </svg>`;
}

// ===== SVG CHART: Trend =====
function svgTrend(prov,name){
  const w=680,h=320,marginT=40,marginB=50,marginL=60,marginR=40;
  const cw = w-marginL-marginR;
  const ch = h-marginT-marginB;
  const p10 = prov.p10, p20 = prov.p;
  const maxP = Math.max(p10,p20)*1.1;
  const minP = Math.min(p10,p20)*0.9;
  const x1 = marginL+30, x2 = marginL+cw-30;
  const y1 = marginT+ch-((p10-minP)/(maxP-minP))*ch;
  const y2 = marginT+ch-((p20-minP)/(maxP-minP))*ch;
  const growth = growthRate(p20,p10);
  const growthColor = parseFloat(growth)>0?'#4ADE80':'#FF5C39';
  // Grid lines
  const gridLines = [0,0.25,0.5,0.75,1].map(t=>{
    const y = marginT+ch*t;
    const val = maxP-(maxP-minP)*t;
    return `<line x1="${marginL}" y1="${y}" x2="${w-marginR}" y2="${y}" stroke="#222" stroke-width="1"/>
            <text x="${marginL-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#555">${val.toFixed(0)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${gridLines}
    <line x1="${marginL}" y1="${marginT+ch}" x2="${w-marginR}" y2="${marginT+ch}" stroke="#444" stroke-width="1.5"/>
    <!-- Area -->
    <path d="M${x1},${marginT+ch} L${x1},${y1} L${x2},${y2} L${x2},${marginT+ch} Z" fill="${prov.co}" opacity="0.12"/>
    <!-- Line -->
    <line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${prov.co}" stroke-width="3"/>
    <!-- Points -->
    <circle cx="${x1}" cy="${y1}" r="8" fill="${prov.co}"/>
    <circle cx="${x2}" cy="${y2}" r="8" fill="${prov.co}"/>
    <!-- Labels -->
    <text x="${x1}" y="${y1-16}" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">${fmt(p10)}</text>
    <text x="${x1}" y="${y1-2}" text-anchor="middle" font-size="11" fill="#888">2010年 · 第六次普查</text>
    <text x="${x2}" y="${y2-16}" text-anchor="middle" font-size="18" font-weight="900" fill="#fff">${fmt(p20)}</text>
    <text x="${x2}" y="${y2-2}" text-anchor="middle" font-size="11" fill="#888">2020年 · 第七次普查</text>
    <!-- Growth -->
    <rect x="${(x1+x2)/2-50}" y="${marginT+8}" width="100" height="28" fill="${growthColor}" rx="3"/>
    <text x="${(x1+x2)/2}" y="${marginT+27}" text-anchor="middle" font-size="14" font-weight="900" fill="#000">${parseFloat(growth)>0?'+':''}${growth}%</text>
    <!-- X-axis labels -->
    <text x="${x1}" y="${marginT+ch+25}" text-anchor="middle" font-size="12" font-weight="700" fill="#999">2010</text>
    <text x="${x2}" y="${marginT+ch+25}" text-anchor="middle" font-size="12" font-weight="700" fill="#999">2020</text>
    <text x="${marginL-8}" y="${marginT-8}" text-anchor="end" font-size="11" fill="#555">万人</text>
  </svg>`;
}

// ===== SVG CHART: Age Donut =====
function svgDonut(prov){
  const w=320,h=320,cx=160,cy=160,r=110,sw=36;
  const segs = [
    {label:'0-14岁',val:prov.a[0],color:'#4ADE80'},
    {label:'15-59岁',val:prov.a[1],color:'#38BDF8'},
    {label:'60岁+',val:prov.a[2],color:'#FF5C39'}
  ];
  const C = 2*Math.PI*r;
  let offset = 0;
  let segHtml = '';
  segs.forEach(s=>{
    const dash = (s.val/100)*C;
    segHtml += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="${dash} ${C-dash}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" opacity="0.9"/>`;
    offset += dash;
  });
  // Center text
  const centerTxt = `<text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="32" font-weight="900" fill="#fff">${prov.a[2].toFixed(1)}%</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="12" fill="#888">60岁以上</text>`;
  // Legend
  let legend = '';
  segs.forEach((s,i)=>{
    const ly = 250+i*22;
    legend += `<rect x="40" y="${ly}" width="14" height="14" fill="${s.color}" rx="2"/>`;
    legend += `<text x="62" y="${ly+12}" font-size="12" fill="#ccc">${s.label} ${s.val.toFixed(2)}%</text>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${segHtml}${centerTxt}${legend}</svg>`;
}

  const barW = 260, barH = 50, barX = 30, barY = 60;
  const maleW = barW*malePct/100;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <text x="${w/2}" y="30" text-anchor="middle" font-size="14" font-weight="800" fill="#999">性别构成</text>
    <rect x="${barX}" y="${barY}" width="${maleW}" height="${barH}" fill="#38BDF8" opacity="0.85" rx="2"/>
    <rect x="${barX+maleW}" y="${barY}" width="${barW-maleW}" height="${barH}" fill="#FF3D7F" opacity="0.85" rx="2"/>
    <text x="${barX+maleW/2}" y="${barY+barH/2+5}" text-anchor="middle" font-size="16" font-weight="900" fill="#000">${malePct.toFixed(1)}%</text>
    <text x="${barX+maleW+(barW-maleW)/2}" y="${barY+barH/2+5}" text-anchor="middle" font-size="16" font-weight="900" fill="#000">${femalePct.toFixed(1)}%</text>
    <text x="${barX}" y="${barY+barH+22}" font-size="12" font-weight="700" fill="#38BDF8">男</text>
    <text x="${barX+barW}" y="${barY+barH+22}" text-anchor="end" font-size="12" font-weight="700" fill="#FF3D7F">女</text>
    <text x="${w/2}" y="${barY+barH+22}" text-anchor="middle" font-size="13" font-weight="700" fill="#ccc">性别比 ${ratio}（男:女=100）</text>
    <text x="${w/2}" y="${h-8}" text-anchor="middle" font-size="11" fill="#555">全国均值 105.07</text>
  </svg>`;
}

// ===== SVG IMAGE 2: Population Figures Collage =====
function svgPopulationFigures(prov){
  const w=300,h=300;
  const colors = [prov.co,'#38BDF8','#FF3D7F','#FFE03D','#4ADE80'];
  let figures = '';
  // Abstract human figures (circle head + rounded body)
  const positions = [
    {x:80,y:60,s:40,c:0},{x:180,y:50,s:55,c:1},{x:60,y:150,s:30,c:2},
    {x:140,y:130,s:45,c:3},{x:220,y:140,s:35,c:4},{x:100,y:220,s:28,c:1},
    {x:190,y:210,s:38,c:0}
  ];
  positions.forEach(p=>{
    const r = p.s*0.35;
    figures += `<circle cx="${p.x}" cy="${p.y}" r="${r}" fill="${colors[p.c]}" opacity="0.8"/>`;
    figures += `<rect x="${p.x-p.s*0.4}" y="${p.y+r}" width="${p.s*0.8}" height="${p.s*0.8}" fill="${colors[p.c]}" opacity="0.6" rx="${p.s*0.15}"/>`;
  });
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${figures}</svg>`;
}

        <div class="mc-label">60岁以上占比</div>
        <div><span class="mc-num" style="color:${prov.co}">${prov.a[2]}</span><span class="mc-unit">%</span></div>

        <div class="mc-label">人口密度</div>
        <div><span class="mc-num" style="color:${prov.co}">${fmt(prov.d)}</span><span class="mc-unit">人/km²</span></div>

      <div class="m-card">
        <div class="mc-label">户均人口</div>

        <div><span class="mc-num" style="color:${prov.co}">${prov.a[0]}</span><span class="mc-unit">%</span></div>

// ===== RENDER: City Detail =====
function showCityDetail(provName,cityName){
  const prov = PD[provName];
  const city = prov.c.find(c=>c[0]===cityName);
  if(!city) return;
  const el = document.getElementById('cityContent');
  const cityPop = city[1];
  const provAvg = prov.p/prov.c.length;
  const provPct = (cityPop/prov.p*100).toFixed(2);
  const rank = [...prov.c].sort((a,b)=>b[1]-a[1]).findIndex(c=>c[0]===cityName)+1;
  // Comparison bars
  const cmpBar = (cityVal,provVal,label,color1,color2)=>{
    const maxV = Math.max(cityVal,provVal)*1.2;
    return `<div class="compare-card">
      <div class="cp-label">${label}</div>
      <div class="cp-bars">
        <div class="cp-bar-wrap">
          <div class="cp-bar-label">全省均值 <span style="color:${color1};font-weight:700">${provVal.toFixed(2)}</span></div>
          <div class="cp-bar"><div class="cp-bar-fill cp-prov" style="width:${provVal/maxV*100}%;background:${color1}"></div></div>
        </div>
        <div class="cp-bar-wrap">
          <div class="cp-bar-label">本市 <span style="color:${color2};font-weight:700">${cityVal.toFixed(2)}</span></div>
          <div class="cp-bar"><div class="cp-bar-fill cp-city" style="width:${cityVal/maxV*100}%;background:${color2}"></div></div>
        </div>
      </div>
    </div>`;
  };
  el.innerHTML = `
    <div class="city-header" style="position:relative">
      <div class="ch-name" style="color:${prov.co}">${cityName}</div>
      <div>
        <div style="font-size:14px;color:var(--t2);margin-bottom:4px">${provName} · ${prov.r}地区</div>
        <div><span class="ch-pop" style="color:${prov.co}">${fmt(cityPop)}</span><span class="ch-unit"> 万人</span></div>
      </div>
    </div>
    <div class="metric-grid">
      <div class="m-card">
        <div class="mc-label">常住人口</div>
        <div><span class="mc-num" style="color:${prov.co}">${fmt(cityPop)}</span><span class="mc-unit">万人</span></div>
        <div class="mc-compare up">全省占比 ${provPct}%</div>
      </div>
      <div class="m-card">
        <div class="mc-label">全省排名</div>
        <div><span class="mc-num" style="color:${prov.co}">第${rank}位</span></div>
        <div class="mc-compare">共 ${prov.c.length} 个行政单位</div>
      </div>
      <div class="m-card">
        <div class="mc-label">vs 全省均值</div>
        <div><span class="mc-num" style="color:${cityPop>=provAvg?'#4ADE80':'#FF5C39'}">${cityPop>=provAvg?'+':''}${(cityPop-provAvg).toFixed(2)}</span><span class="mc-unit">万人</span></div>
        <div class="mc-compare ${cityPop>=provAvg?'up':'down'}">${cityPop>=provAvg?'高于':'低于'}全省均值 ${provAvg.toFixed(2)} 万人</div>
      </div>
    </div>
    <!-- Comparison Charts -->
    <div class="chart-grid">
      <div class="chart-box full">
        <div class="chart-title">城市与全省对比</div>
        <div class="chart-subtitle">${cityName} 与 ${provName} 全省均值的关键指标对比</div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1px;background:var(--border)">
          ${cmpBar(cityPop,provAvg,'常住人口（万人）','#FF5C39','#00E5CC')}
          ${cmpBar(prov.a[0],prov.a[0],'0-14岁占比（%）','#FF5C39','#00E5CC')}
          ${cmpBar(prov.a[1],prov.a[1],'15-59岁占比（%）','#FF5C39','#00E5CC')}
          ${cmpBar(prov.a[2],prov.a[2],'60岁以上占比（%）','#FF5C39','#00E5CC')}
          ${cmpBar(prov.u,prov.u,'城镇化率（%）','#FF5C39','#00E5CC')}
          ${cmpBar(prov.g,prov.g,'性别比','#FF5C39','#00E5CC')}
        </div>
      </div>
      <div class="chart-box full">
        <div class="chart-title">${provName} 各地市人口排行</div>
        <div class="chart-subtitle">红条标记为当前选中城市 · ${cityName}</div>
        <div class="chart-svg-wrap">${svgCityBarsHighlight(prov,cityName)}</div>
      </div>
    </div>
  `;
  document.getElementById('citySection').classList.add('active');
  document.getElementById('citySection').scrollIntoView({behavior:'smooth'});
}

// ===== SVG CHART: City Bars with Highlight =====
function svgCityBarsHighlight(prov,highlightCity){
  const cities = [...prov.c].sort((a,b)=>b[1]-a[1]);
  const w=680,h=Math.max(300,cities.length*42+40),marginT=20,marginB=30,marginL=70,marginR=80;
  const barH=28,gap=10;
  const maxVal = cities[0][1];
  let bars = '';
  cities.forEach((c,i)=>{
    const y = marginT+i*(barH+gap);
    const bw = (c[1]/maxVal)*(w-marginL-marginR);
    const isHL = c[0]===highlightCity;
    const fillColor = isHL ? '#FF3D7F' : prov.co;
    const opacity = isHL ? 1 : 0.4+0.4*(c[1]/maxVal);
    bars += `<text x="${marginL-10}" y="${y+barH/2+5}" text-anchor="end" font-size="13" font-weight="${isHL?'800':'600'}" fill="${isHL?'#FF3D7F':'#ccc'}">${c[0]}</text>`;
    bars += `<rect x="${marginL}" y="${y}" width="${bw}" height="${barH}" fill="${fillColor}" opacity="${opacity}" rx="2"/>`;
    bars += `<text x="${marginL+bw+8}" y="${y+barH/2+5}" font-size="13" font-weight="${isHL?'900':'700'}" fill="${fillColor}">${fmt(c[1])}</text>`;
  });
  bars += `<text x="${w-marginR}" y="${h-8}" text-anchor="end" font-size="11" fill="#555">常住人口 · 万人</text>`;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
}

function closeCityDetail(){
  document.getElementById('citySection').classList.remove('active');
  document.getElementById('detailSection').scrollIntoView({behavior:'smooth'});
}


// ===== Deep link from Workbench (?province=&city=) =====
function applyDeepLink(){
  try {
    const q = new URLSearchParams(location.search);
    const province = (q.get('province') || '').trim();
    const city = (q.get('city') || '').trim();
    if (province && PD[province]) {
      showDetail(province);
      if (city) {
        setTimeout(() => showCityDetail(province, city), 80);
      }
    }
  } catch (e) {}
}

// ===== INIT =====
renderNatMetrics();
renderHeroVisual();
renderSortBar();
renderProvGrid();
applyDeepLink();
</script>
